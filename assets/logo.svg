<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="convsearch mark">
  <title>convsearch</title>
  <!--
    Concept: a stack of rounded tiles (your conversation history, kept local
    and layered like an archive) with the front tile punched through by a
    perfectly round porthole (the search lens looking back into that
    archive). The hole is real transparency (an SVG mask), not a drawn
    circle, so the mark automatically shows whatever is behind it - it
    never needs a background-color swatch to "complete" itself, which is
    why it holds up on both light and dark surfaces.

    Colour: fill="currentColor" throughout. Set the CSS `color` of a parent
    element to control the mark's colour; see assets/README.md.
  -->
  <defs>
    <mask id="convsearch-porthole" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <circle cx="58" cy="58" r="17" fill="#000"/>
    </mask>
  </defs>

  <!-- back tile: one older layer of history, offset generously so it reads
       as a bold second layer instead of a hairline sliver at small sizes -->
  <rect x="9" y="9" width="58" height="58" rx="16" fill="currentColor" opacity="0.4"/>
  <!-- front tile, with the search porthole cut through it -->
  <rect x="29" y="29" width="58" height="58" rx="16" fill="currentColor" mask="url(#convsearch-porthole)"/>
</svg>
